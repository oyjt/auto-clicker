name: Release DMG

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Validate release notes
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected tag vX.Y.Z" >&2; exit 1; }
          python3 scripts/release-notes.py "${RELEASE_TAG#v}"

      - name: Test
        run: |
          python3 scripts/test-release-notes.py
          CLANG_MODULE_CACHE_PATH="$PWD/.build/module-cache" \
          swift test --disable-sandbox --cache-path .build/cache \
            --config-path .build/config --security-path .build/security

      - name: Build universal DMG
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package-dmg.sh "${RELEASE_TAG#v}"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            "build/AutoClicker-$version-universal.dmg" \
            "build/AutoClicker-$version-universal.dmg.sha256" \
            "build/AutoClicker-$version-release-notes.md"
